version: 2

project_name: initech

# Query the remote tag inventory even for local releases. The file is outside
# dist because GoReleaser cleans dist AFTER before hooks, and is keyed by tag
# so a skipped hook cannot silently reuse another release's decision.
before:
  hooks:
    - go run ./scripts/releasepolicy -tag {{ .Tag }} -output .release-promotion-{{ .Tag }}

changelog:
  sort: asc
  filters:
    exclude:
      - '^qa:'
      - '^docs:'
      - '^test:'
      - '^Merge'
  groups:
    - title: Features
      regexp: '^feat'
    - title: Bug Fixes
      regexp: '^fix'
    - title: Other
      order: 999

builds:
  - binary: initech
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/nmelo/initech/cmd.Version={{.Version}}

archives:
  - formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

release:
  github:
    owner: nmelo
    name: initech
  draft: false
  prerelease: auto
  make_latest: '{{ trim (mustReadFile (printf ".release-promotion-%s" .Tag)) }}'

brews:
  - skip_upload: '{{ ne (trim (mustReadFile (printf ".release-promotion-%s" .Tag))) "true" }}'
    repository:
      owner: nmelo
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Formula
    homepage: https://github.com/nmelo/initech
    description: Bootstrap and manage multi-agent development projects
    license: MIT
    install: |
      bin.install "initech"
    test: |
      system "#{bin}/initech", "version"
