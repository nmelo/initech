name: Rigs

# Rigs (the four composed-rig shards and the race detector) run NIGHTLY and ON
# DEMAND, never on push: a scheduled run at 07:00 UTC (03:00 ET in summer
# time, 02:00 in winter), and workflow_dispatch, which any agent may trigger
# when it judges a change needs it. At a release cut, shipper's gate cites the
# latest green nightly when its commit is an ancestor of the cut and nothing
# between them touches a rig area (PTYs, sockets, two windows, suspend/wake,
# the send path, the rigs themselves); otherwise it dispatches this workflow at
# the cut sha, as it does when no nightly from the last 48 hours exists. A red
# nightly holds the next cut until super has read it. This takes the rigs off
# the landing-to-release path. Pull requests never reach the Mac (see ci.yml).
#
# A SEPARATE FILE, not jobs in ci.yml behind an event condition: shipper's
# release gate derives the expected job set from ci.yml and asserts a push run
# EQUALS it, so ci.yml must hold only jobs that always run on push.
#
# scripts/rigcensus reads this file as well as ci.yml, so a rig invoked here
# still counts as invoked.
on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

# Concurrency: the same rule as ci.yml (see its header). Only main pushes share
# a group and cancel each other; schedule, dispatch and any other run has its own.
concurrency:
  group: ${{ github.workflow }}-${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && 'main-push' || github.run_id }}
  cancel-in-progress: true

# Runner selection and the MAC_RUNNER revert: see the header of ci.yml (ini-8k1o).
# setup-go's cache: on for pull requests only, as in ci.yml (see its CACHE
# note). The Mac's slots share one Go build cache, and a restore unpacked into
# it while another job compiles from it breaks that compile.
jobs:
  race:
    runs-on: ${{ github.event_name != 'pull_request' && vars.MAC_RUNNER || 'macos-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: ${{ github.event_name == 'pull_request' }}

      # ini-4cfl: `make test-race` existed, unrun by any gate, and 7 data
      # races accumulated invisibly in the suspend/wake path -- resumePane's
      # async pane-swap (resource.go) writing t.panes while a test's own
      # goroutine polled it directly, the same "the gate reports on less than
      # the claim" shape as ini-4bf2's -short blind spot. Its own step so a
      # race-only failure is diagnosable without conflating it with the plain
      # full-suite step above. Not in `make check` (the pre-commit gate):
      # -race roughly doubles the wall clock, and the per-commit cost is the
      # wrong place to pay it -- the same reasoning ini-0lko used to move slow
      # rig coverage into CI rather than local hooks.
      - name: Test (race detector)
        run: make test-race

  # THE COMPOSED RIGS, SHARDED BY MEASURED TIME (ini-q6dp).
  #
  # One go test ran all 13 selectors serially: 12.8 min on every release gate.
  # Measured per rig with -v (eng1, 2026-10-08; pm measured the same totals
  # independently): 723s serial, largest single rig 108.7s, largest single test
  # 56.0s. NO rig dominates, so the fix is sharding rather than clock injection.
  #
  # Balanced longest-processing-time-first, not by count: 189/183/179/173s, so
  # the gate costs the longest shard (~3 min) instead of the sum.
  #
  # THE UNION IS ASSERTED, NOT TRUSTED: scripts/rigcensus requires, per rig,
  # some step that BOTH sets its env gate and selects one of its tests
  # (coveredBy). A rig dropped from every shard is therefore uncovered and
  # fails the build -- verified by dropping one and watching the census fail.
  # That is why these are four explicit jobs with LITERAL selectors and not a
  # matrix: a matrix leaves "${{ matrix.selector }}" in the run string, which
  # the census would read as a regex matching nothing.
  #
  # Each shard sets only the gates its own rigs need (INITECH_9IMX appears in
  # two shards because SuspendGuard and SuspendFate share one gate). Shards are
  # separate jobs, and every rig builds its binary and root under its own
  # t.TempDir, so no shard shares a temp dir or a binary name with another.
  composed-rigs-shard1:
    # ~189s measured: X5OB 108.7s + FN77 54.9s + A9D8 25.2s
    runs-on: ${{ github.event_name != 'pull_request' && vars.MAC_RUNNER || 'macos-latest' }}
    # ini-8k1o: every job that can land on the self-hosted Mac carries a
    # timeout, or a wedged rig holds a runner to GitHub 6h cap. Measured ~3
    # min; 10 is ~3x headroom. (shipper caught this missing on 2d2f909.)
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: ${{ github.event_name == 'pull_request' }}

      # ini-0lko: name what this shard selected, before running it.
      - name: Witness which rigs this shard selected
        run: go test ./internal/tui/ -list 'X5obRig|FN77Rig|A9d8Rig'

      - name: Composed multi-window rigs (real binaries, real PTYs)
        env:
          INITECH_X5OB: "1"
          INITECH_FN77: "1"
          INITECH_A9D8: "1"
        # -v so the log NAMES every rig that ran: without it a skipped rig is
        # invisible and a shard reports a vacuous green (shipper, reviewing
        # 2d2f909 -- the first dispatch had zero PASS/SKIP lines to check).
        run: go test ./internal/tui/ -count=1 -v -timeout 900s -run 'X5obRig|FN77Rig|A9d8Rig'

  composed-rigs-shard2:
    # ~183s measured: SuspendGuard 98.1s + AQY 55.9s + UZ42 29.2s
    runs-on: ${{ github.event_name != 'pull_request' && vars.MAC_RUNNER || 'macos-latest' }}
    # ini-8k1o: every job that can land on the self-hosted Mac carries a
    # timeout, or a wedged rig holds a runner to GitHub 6h cap. Measured ~3
    # min; 10 is ~3x headroom. (shipper caught this missing on 2d2f909.)
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: ${{ github.event_name == 'pull_request' }}

      # ini-0lko: name what this shard selected, before running it.
      - name: Witness which rigs this shard selected
        run: go test ./internal/tui/ -list 'TestSuspendGuard|TestAQY_|UZ42Rig'

      - name: Composed multi-window rigs (real binaries, real PTYs)
        env:
          INITECH_9IMX: "1"
          INITECH_AQY: "1"
          INITECH_UZ42: "1"
        # -v so the log NAMES every rig that ran: without it a skipped rig is
        # invisible and a shard reports a vacuous green (shipper, reviewing
        # 2d2f909 -- the first dispatch had zero PASS/SKIP lines to check).
        run: go test ./internal/tui/ -count=1 -v -timeout 900s -run 'TestSuspendGuard|TestAQY_|UZ42Rig'

  composed-rigs-shard3:
    # ~179s measured: 9ISX 79.7s + Dr03 56.0s + 9GVN 35.6s + Z5UW 7.2s
    runs-on: ${{ github.event_name != 'pull_request' && vars.MAC_RUNNER || 'macos-latest' }}
    # ini-8k1o: every job that can land on the self-hosted Mac carries a
    # timeout, or a wedged rig holds a runner to GitHub 6h cap. Measured ~3
    # min; 10 is ~3x headroom. (shipper caught this missing on 2d2f909.)
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: ${{ github.event_name == 'pull_request' }}

      # ini-0lko: name what this shard selected, before running it.
      - name: Witness which rigs this shard selected
        run: go test ./internal/tui/ -list 'NineISXRig|Dr03Rig|NineGVNRig|TestZ5uwRig'

      - name: Composed multi-window rigs (real binaries, real PTYs)
        env:
          INITECH_9ISX: "1"
          INITECH_DR03: "1"
          INITECH_9GVN: "1"
          INITECH_Z5UW: "1"
        # -v so the log NAMES every rig that ran: without it a skipped rig is
        # invisible and a shard reports a vacuous green (shipper, reviewing
        # 2d2f909 -- the first dispatch had zero PASS/SKIP lines to check).
        run: go test ./internal/tui/ -count=1 -v -timeout 900s -run 'NineISXRig|Dr03Rig|NineGVNRig|TestZ5uwRig'

  composed-rigs-shard4:
    # ~173s measured: Attention 73.0s + SuspendFate 65.7s + Inbox7 34.1s
    runs-on: ${{ github.event_name != 'pull_request' && vars.MAC_RUNNER || 'macos-latest' }}
    # ini-8k1o: every job that can land on the self-hosted Mac carries a
    # timeout, or a wedged rig holds a runner to GitHub 6h cap. Measured ~3
    # min; 10 is ~3x headroom. (shipper caught this missing on 2d2f909.)
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: ${{ github.event_name == 'pull_request' }}

      # ini-0lko: name what this shard selected, before running it.
      - name: Witness which rigs this shard selected
        run: go test ./internal/tui/ -list 'AttentionRig|TestSuspendFate|Inbox7Rig'

      - name: Composed multi-window rigs (real binaries, real PTYs)
        env:
          INITECH_35AK: "1"
          INITECH_9IMX: "1"
          INITECH_3WKL7: "1"
        # -v so the log NAMES every rig that ran: without it a skipped rig is
        # invisible and a shard reports a vacuous green (shipper, reviewing
        # 2d2f909 -- the first dispatch had zero PASS/SKIP lines to check).
        run: go test ./internal/tui/ -count=1 -v -timeout 900s -run 'AttentionRig|TestSuspendFate|Inbox7Rig'
