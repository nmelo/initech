name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build
        run: go build -ldflags "-s -w" -o initech${{ matrix.os == 'windows-latest' && '.exe' || '' }} .

      - name: Vet
        run: go vet ./...

      # ini-ybe.1: reject test names admitting "we just call it and see if
      # it crashes" intent. Linux-only — content check, no value running 3x.
      # No user input interpolated; matrix.os is workflow-defined, script
      # path is static.
      - name: Lint test names
        if: matrix.os == 'ubuntu-latest'
        run: bash scripts/lint-test-names.sh

      # ini-2x8.8: fail when a test file compiles on one platform and not
      # another without a declared exemption. Static (`go list` applies build
      # constraints without running anything), so one leg answers for all three
      # -- same reason lint-test-names is ubuntu-only. Also runs in `make check`
      # at commit time; this is the backstop for a push that skipped it.
      - name: Test census (cross-platform suite parity)
        if: matrix.os == 'ubuntu-latest'
        run: go run ./scripts/testcensus

      # ini-47w: witness WHICH tests this platform actually compiled, by name.
      # Build constraints silently remove whole suites from a leg -- a portable
      # helper parked in a '//go:build !windows' file drags every consumer out
      # with it, and CI still reports that leg green because a green run does
      # not witness suites that never ran. This lists the names so absence is
      # visible in the log rather than inferred from a passing total.
      #
      # Runs BEFORE Test on purpose: when restoring a suite to a platform
      # unmasks real failures, the names are already in the log above them.
      # -list compiles and enumerates without running, so it costs seconds.
      - name: Witness tests present on this platform
        run: go test ./internal/tui/ -list '.*' -count=1

      - name: Test
        run: go test ./... -count=1 -short

  # THE NON-SHORT SUITE, on one platform (ini-4bf2).
  #
  # Every other leg above runs -short, and so does `make test`, and so did the
  # release gate. That is not an oversight -- -short skips slow PTY integration
  # tests and takes the local loop from ~55s to ~14s, which is worth having.
  # What was missing is that NOTHING ran the other half. A belt regression
  # (ini-4bf2) reddened TestInjectText_StashSkipsRetry the moment it shipped,
  # the test did its job, and no gate could see it: main carried a red full
  # suite through v2.7.9 AND v2.8.0 because every gate wore the same blindfold.
  #
  # One platform, not the matrix: the tests this adds are unix-PTY integration
  # tests that do not run on windows anyway, and the point is coverage of the
  # skipped HALF, not of every OS. Gated rigs stay opt-in behind their env vars,
  # so this leg does not spawn Claude sessions.
  full-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Test (full, no -short)
        run: make test-full

  # THE COMPOSED RIGS (ini-jlo2), on main only.
  #
  # WHY THIS EXISTS: ini-x5ob passed vet, the full short suite and per-leg CI on
  # all three platforms, and rendered window 2 completely blank. An env-gated rig
  # caught it; nothing in CI could have, because nothing sets the env var. The
  # ship gates added this week cover RELEASES; this covers the window between a
  # push and the next cut, which is where other agents rebase onto the damage.
  #
  # WHY ONLY THESE THREE. The dividing line is not slowness, it is Claude: the
  # 6M4/ZJHG/ALTPROBE/LIVEPROBE/OSC_PROBE/NOTIF_PROBE rigs spawn a real Claude,
  # which a runner has no auth or budget for and which is a nondeterministic
  # third-party TUI as a fixture. Those stay ship-gate-only permanently -- that
  # is a decision, not an oversight, and it is written here so it is not
  # re-opened. INITECH_9IMX is Claude-free but costs ~250s on its own, more than
  # these three combined, because its waits are real agent respawns rather than
  # sleeps that could be polled away; excluded on cost, revisit if it gets
  # cheaper.
  #
  # WHY MAIN-ONLY AND NOT PRs: this bead is about the main window specifically,
  # and per-branch runs would triple the cost to cover a window the ship gates
  # already backstop.
  #
  # WHY NOT A NIGHTLY: the damage model is "other agents rebase onto it", which
  # happens in minutes. A nightly would have caught tonight's regression
  # tomorrow.
  #
  # Ubuntu only: these are unix-PTY rigs that do not run on windows anyway, and
  # the point is covering the composed CLAIM, not every OS.
  composed-rigs:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Composed multi-window rigs (real binaries, real PTYs)
        env:
          INITECH_9ISX: "1"
          INITECH_X5OB: "1"
          INITECH_AQY: "1"
          # ini-35ak's composed rig: a question opening on window 1 must reach
          # window 2. Added here rather than left env-gated-and-unrun, which is
          # the shape ini-jlo2 exists to close -- a rig nobody runs is
          # documentation.
          INITECH_35AK: "1"
        run: go test ./internal/tui/ -count=1 -timeout 900s -run 'NineISXRig|X5obRig|AttentionRig|TestAQY_'
