name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build
        run: go build -ldflags "-s -w" -o initech .

      - name: Vet
        run: go vet ./...

      # ini-ybe.1: reject test names admitting "we just call it and see if
      # it crashes" intent. A content check — one leg answers for all.
      # No user input interpolated; matrix.os is workflow-defined, script
      # path is static.
      - name: Lint test names
        run: bash scripts/lint-test-names.sh

      # ini-2x8.8: fail when a test file compiles on one platform and not
      # another without a declared exemption. Static (`go list` applies build
      # constraints without running anything), so one leg answers for all three
      # -- one leg answers for all. Also runs in `make check`
      # at commit time; this is the backstop for a push that skipped it.
      - name: Test census (cross-platform suite parity)
        run: go run ./scripts/testcensus

      # ini-0lko: fail when an env-gated rig exists that no CI job runs. The
      # composed-rigs job names every rig TWICE -- an `env:` block and a `-run`
      # selector -- and a rig runs only when both mention it. Both lists are
      # hand-maintained, which is how INITECH_9IMX went un-run for its entire
      # life while the job reported green, and how INITECH_35AK was wired into
      # `env:` but left out of the selector (caught by a human reading a diff).
      # This step reads THIS file and the test inventory and derives the answer,
      # so the next unwired rig fails the build instead of going quiet.
      # ini-nvpg: this same run now checks a SECOND inventory -- Makefile
      # targets. A target nothing invokes is the Makefile's version of a gated
      # rig nobody runs, and `make test-race` was exactly that: written
      # deliberately, in no gate, with 7 data races behind it (ini-4cfl).
      #
      # Static (parse-only), so one leg answers for all. (Was "all three" until
      # ini-ibsm left macOS the only tested platform.)
      - name: Census (every gated rig and every make target is invoked or exempted)
        run: go run ./scripts/rigcensus -v

      # ini-47w: witness WHICH tests this platform actually compiled, by name.
      # Build constraints silently remove whole suites from a leg -- a portable
      # helper parked in a '//go:build !windows' file drags every consumer out
      # with it, and CI still reports that leg green because a green run does
      # not witness suites that never ran. This lists the names so absence is
      # visible in the log rather than inferred from a passing total.
      #
      # Runs BEFORE Test on purpose: when restoring a suite to a platform
      # unmasks real failures, the names are already in the log above them.
      # -list compiles and enumerates without running, so it costs seconds.
      - name: Witness tests present on this platform
        run: go test ./internal/tui/ -list '.*' -count=1

      - name: Test
        run: go test ./... -count=1 -short

  # THE NON-SHORT SUITE, on one platform (ini-4bf2).
  #
  # Every other leg above runs -short, and so does `make test`, and so did the
  # release gate. That is not an oversight -- -short skips slow PTY integration
  # tests and takes the local loop from ~55s to ~14s, which is worth having.
  # What was missing is that NOTHING ran the other half. A belt regression
  # (ini-4bf2) reddened TestInjectText_StashSkipsRetry the moment it shipped,
  # the test did its job, and no gate could see it: main carried a red full
  # suite through v2.7.9 AND v2.8.0 because every gate wore the same blindfold.
  #
  # One platform, not the matrix: the tests this adds are unix-PTY integration
  # tests that do not run on windows anyway, and the point is coverage of the
  # skipped HALF, not of every OS. Gated rigs stay opt-in behind their env vars,
  # so this leg does not spawn Claude sessions.
  full-suite:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Test (full, no -short)
        run: make test-full

      # ini-4cfl: `make test-race` existed, unrun by any gate, and 7 data
      # races accumulated invisibly in the suspend/wake path -- resumePane's
      # async pane-swap (resource.go) writing t.panes while a test's own
      # goroutine polled it directly, the same "the gate reports on less than
      # the claim" shape as ini-4bf2's -short blind spot. Its own step so a
      # race-only failure is diagnosable without conflating it with the plain
      # full-suite step above. Not in `make check` (the pre-commit gate):
      # -race roughly doubles the wall clock, and the per-commit cost is the
      # wrong place to pay it -- the same reasoning ini-0lko used to move slow
      # rig coverage into CI rather than local hooks.
      - name: Test (race detector)
        run: make test-race


  # ITEM 2 (ini-0lko): the CENSUS leg. Builds the real binary; no Claude needed.
  #
  # CI set INITECH_CENSUS exactly zero times before this bead, so the
  # zero-change census — the check that a single-window fleet renders
  # byte-identically to the shipped release — was a thing a human ran or did
  # not. Its own job rather than a line in composed-rigs because it proves a
  # different KIND of thing (the CLI surface and the rendered census) and would
  # otherwise be trimmed alongside rigs it has nothing to do with.
  #
  #   TestCensus_        a single-window fleet renders exactly as the release did
  #   TestRolesLessBoot_ a pure viewer boots with zero local agents
  #   TestWindowCLI_     the --window CLI surface: attach, detach, reattach, and
  #                      a viewer touching no project-root store
  census-leg:
    if: github.event_name == 'push'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # ini-0lko: same witness for the census leg -- name what it selected.
      - name: Witness which census tests this leg selected
        run: go test ./internal/tui/ -list 'TestCensus_|TestRolesLessBoot_|TestWindowCLI_'

      - name: Census and window-CLI integration
        env:
          INITECH_CENSUS: "1"
        run: go test ./internal/tui/ -count=1 -timeout 900s -run 'TestCensus_|TestRolesLessBoot_|TestWindowCLI_'

  # ITEM 5 (ini-0lko): the SAME composed rigs, on macOS.
  #
  # Before this, NO rig ran on macOS anywhere: the macos matrix leg is -short,
  # which skips every gated rig by construction. That is not a theoretical gap —
  # ini-hbj4 passed darwin and failed linux all four rounds, which is why this
  # leg was created. Under ini-ibsm linux is no longer tested at all, so the
  # asymmetry that motivated it is gone -- what remains is that the rigs need a
  # tested platform to run on, and macOS is it.
  #
  # ini-ibsm: this WAS the macOS twin of an ubuntu leg. macOS is now the only
  # tested platform, so it is simply the rig leg.
  composed-rigs:
    if: github.event_name == 'push'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # ini-0lko: name the rigs this leg SELECTED, before running them. A rig
      # job that prints only "ok" witnesses a duration, not a test list -- and
      # this leg's whole purpose is that a specific set of rigs ran. Without
      # this, a selector that silently matches nothing is indistinguishable
      # from a green run, which is the exact failure the census exists to stop
      # one level up. -list compiles and enumerates without running.
      - name: Witness which rigs this leg selected
        run: go test ./internal/tui/ -list 'NineISXRig|X5obRig|AttentionRig|TestAQY_|NineGVNRig|TestSuspendFate|TestSuspendGuard|A9d8Rig|Dr03Rig'

      - name: Composed multi-window rigs (real binaries, real PTYs)
        env:
          INITECH_9ISX: "1"
          INITECH_X5OB: "1"
          INITECH_AQY: "1"
          INITECH_35AK: "1"
          # ini-ibsm: 9GVN and 9IMX were quarantined against ini-8mrq, which was
          # an ubuntu-only sh-fixture failure. macOS is the tested platform now
          # and both PASS here, so they gate like any other rig -- the
          # quarantine is removed rather than carried forward pointing at a
          # failure no tested platform sees.
          INITECH_9GVN: "1"
          INITECH_9IMX: "1"
          INITECH_A9D8: "1"
          INITECH_DR03: "1"
        run: go test ./internal/tui/ -count=1 -timeout 900s -run 'NineISXRig|X5obRig|AttentionRig|TestAQY_|NineGVNRig|TestSuspendFate|TestSuspendGuard|A9d8Rig|Dr03Rig'
