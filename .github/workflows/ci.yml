name: CI

on:
  push:
    # TEMPORARY (ini-0lko, removed before delivery): this branch adds three rig
    # jobs that have never executed on a GitHub runner. They are gated
    # `if: github.event_name == 'push'` and CI only fires on main, so a PR would
    # SKIP exactly the jobs under test and the first real run would be on main.
    # Witness them here instead.
    branches: [main, fix/0lko-rig-coverage]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build
        run: go build -ldflags "-s -w" -o initech${{ matrix.os == 'windows-latest' && '.exe' || '' }} .

      - name: Vet
        run: go vet ./...

      # ini-ybe.1: reject test names admitting "we just call it and see if
      # it crashes" intent. Linux-only — content check, no value running 3x.
      # No user input interpolated; matrix.os is workflow-defined, script
      # path is static.
      - name: Lint test names
        if: matrix.os == 'ubuntu-latest'
        run: bash scripts/lint-test-names.sh

      # ini-2x8.8: fail when a test file compiles on one platform and not
      # another without a declared exemption. Static (`go list` applies build
      # constraints without running anything), so one leg answers for all three
      # -- same reason lint-test-names is ubuntu-only. Also runs in `make check`
      # at commit time; this is the backstop for a push that skipped it.
      - name: Test census (cross-platform suite parity)
        if: matrix.os == 'ubuntu-latest'
        run: go run ./scripts/testcensus

      # ini-0lko: fail when an env-gated rig exists that no CI job runs. The
      # composed-rigs job names every rig TWICE -- an `env:` block and a `-run`
      # selector -- and a rig runs only when both mention it. Both lists are
      # hand-maintained, which is how INITECH_9IMX went un-run for its entire
      # life while the job reported green, and how INITECH_35AK was wired into
      # `env:` but left out of the selector (caught by a human reading a diff).
      # This step reads THIS file and the test inventory and derives the answer,
      # so the next unwired rig fails the build instead of going quiet.
      # Static (parse-only), so one leg answers for all three.
      - name: Rig census (every gated rig is run by CI or exempted)
        if: matrix.os == 'ubuntu-latest'
        run: go run ./scripts/rigcensus -v

      # ini-47w: witness WHICH tests this platform actually compiled, by name.
      # Build constraints silently remove whole suites from a leg -- a portable
      # helper parked in a '//go:build !windows' file drags every consumer out
      # with it, and CI still reports that leg green because a green run does
      # not witness suites that never ran. This lists the names so absence is
      # visible in the log rather than inferred from a passing total.
      #
      # Runs BEFORE Test on purpose: when restoring a suite to a platform
      # unmasks real failures, the names are already in the log above them.
      # -list compiles and enumerates without running, so it costs seconds.
      - name: Witness tests present on this platform
        run: go test ./internal/tui/ -list '.*' -count=1

      - name: Test
        run: go test ./... -count=1 -short

  # THE NON-SHORT SUITE, on one platform (ini-4bf2).
  #
  # Every other leg above runs -short, and so does `make test`, and so did the
  # release gate. That is not an oversight -- -short skips slow PTY integration
  # tests and takes the local loop from ~55s to ~14s, which is worth having.
  # What was missing is that NOTHING ran the other half. A belt regression
  # (ini-4bf2) reddened TestInjectText_StashSkipsRetry the moment it shipped,
  # the test did its job, and no gate could see it: main carried a red full
  # suite through v2.7.9 AND v2.8.0 because every gate wore the same blindfold.
  #
  # One platform, not the matrix: the tests this adds are unix-PTY integration
  # tests that do not run on windows anyway, and the point is coverage of the
  # skipped HALF, not of every OS. Gated rigs stay opt-in behind their env vars,
  # so this leg does not spawn Claude sessions.
  full-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Test (full, no -short)
        run: make test-full

  # THE COMPOSED RIGS (ini-jlo2), on main only.
  #
  # WHY THIS EXISTS: ini-x5ob passed vet, the full short suite and per-leg CI on
  # all three platforms, and rendered window 2 completely blank. An env-gated rig
  # caught it; nothing in CI could have, because nothing sets the env var. The
  # ship gates added this week cover RELEASES; this covers the window between a
  # push and the next cut, which is where other agents rebase onto the damage.
  #
  # WHY ONLY THESE THREE. The dividing line is not slowness, it is Claude: the
  # 6M4/ZJHG/ALTPROBE/LIVEPROBE/OSC_PROBE/NOTIF_PROBE rigs spawn a real Claude,
  # which a runner has no auth or budget for and which is a nondeterministic
  # third-party TUI as a fixture. Those stay ship-gate-only permanently -- that
  # is a decision, not an oversight, and it is written here so it is not
  # re-opened. INITECH_9IMX is Claude-free but costs ~250s on its own, more than
  # these three combined, because its waits are real agent respawns rather than
  # sleeps that could be polled away; excluded on cost, revisit if it gets
  # cheaper.
  #
  # WHY MAIN-ONLY AND NOT PRs: this bead is about the main window specifically,
  # and per-branch runs would triple the cost to cover a window the ship gates
  # already backstop.
  #
  # WHY NOT A NIGHTLY: the damage model is "other agents rebase onto it", which
  # happens in minutes. A nightly would have caught tonight's regression
  # tomorrow.
  #
  # Ubuntu only: these are unix-PTY rigs that do not run on windows anyway, and
  # the point is covering the composed CLAIM, not every OS.
  composed-rigs:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # ── GROWTH POLICY (ini-uv2c) ──────────────────────────────────
      #
      # This job grew 235s -> 334s in one evening via two CORRECT additions.
      # Neither was a mistake; the problem is that a selector is a LIST, so it
      # extends without anyone deciding to. A budget reached by accretion is a
      # budget nobody chose. Three rules, decided rather than defaulted:
      #
      # 1. THE BUDGET IS POSITIONAL, NOT ABSOLUTE. This job is main-only and
      #    runs parallel to the matrix, so while it is shorter than the SLOWEST
      #    OTHER LEG it costs nothing on the critical path, and growth under
      #    that ceiling is free. The run that EXCEEDS it is what puts this job
      #    on the critical path, and that run triggers a deliberate trim/split
      #    decision by super -- never an automatic drop.
      #    AS OF THIS COMMIT: this job ~334s, slowest other leg ~174s
      #    (full-suite). IT IS ALREADY OVER. Recorded rather than absorbed:
      #    this is precisely the condition rule 1 says to decide about, and a
      #    policy whose first act is to look away from its own trigger is not a
      #    policy.
      #
      # 2. TRIM BY INVARIANT DEDUPLICATION, never by dropping coverage (eng1's
      #    principle, adopted). Two legs proving the SAME invariant merge. Legs
      #    proving DISTINCT invariants are never dropped for time -- especially
      #    canon-named ones: "attention is never scoped" and "the wire carries a
      #    wait at all" are different laws, and trimming one to save a minute
      #    buys the minute with a law.
      #
      # 3. EVERY ADDITION NAMES THE INVARIANT IT UNIQUELY PROVES, beside it.
      #    That is what converts accretion into decisions: a leg that cannot
      #    name a unique invariant is a merge candidate on arrival, and the
      #    naming happens while the author still knows the answer.
      #
      # CURRENT LEGS AND THE INVARIANT EACH UNIQUELY PROVES (retro-annotated):
      #   NineISXRig_ScopedOverlayBothStartupOrders
      #     A window displays its OWN slice and DISCLOSES what it hides
      #     (parity-of-facts with disclosed scoping), in both startup orders.
      #   NineISXRig_AttentionCrossesScoping
      #     ATTENTION IS NEVER SCOPED: a wait on an agent this window does not
      #     display still reaches its list -- and rings only once per host.
      #   X5obRig_AssignThenAttach / _AttachThenAssign
      #     Window 1 is the single computer of ownership: every agent renders in
      #     exactly one window, whichever order the windows started in.
      #   X5obRig_ReattachIsReserved
      #     Ownership is RE-SERVED on reattach: a viewer that dropped and came
      #     back is told again rather than living on a stale copy.
      #   AttentionRig_QuestionOnWindow1ReachesWindow2
      #     The wire carries a wait AT ALL: observe, encode, send, decode, draw.
      #     Distinct from AttentionCrossesScoping, which ASSUMES the wire works
      #     and asks whether scoping suppresses what it carried.
      #   AttentionRig_WaitAlreadyInProgressWhenWindow2Attaches
      #     LATE ATTACH: a wait already in progress reaches a window that was
      #     not there for the transition -- a path no broadcast can serve.
      #   TestAQY_WindowOneScreenAcrossAttach
      #     A viewer attaching does not corrupt window 1's own screen.
      - name: Composed multi-window rigs (real binaries, real PTYs)
        env:
          INITECH_9ISX: "1"
          INITECH_X5OB: "1"
          INITECH_AQY: "1"
          # ini-0lko: 9IMX is the rig that caught the wake-delivery regression
          # which would otherwise have shipped in v2.11.1 -- and it had NEVER
          # been in CI. 9GVN was written, gated, and never wired. Both were
          # found by rigcensus, not by anyone remembering.
          #   9IMX  a message to a SUSPENDED agent is queued and delivered on
          #         wake, at every entry point, never silently dropped.
          #   9GVN  a pane QUOTING dialog text does not hold the fleet's mail;
          #         a real dialog still does.
          INITECH_9IMX: "1"
          INITECH_9GVN: "1"
          # ini-35ak's composed rig: a question opening on window 1 must reach
          # window 2. Added here rather than left env-gated-and-unrun, which is
          # the shape ini-jlo2 exists to close -- a rig nobody runs is
          # documentation.
          INITECH_35AK: "1"
        run: go test ./internal/tui/ -count=1 -timeout 900s -run 'NineISXRig|X5obRig|AttentionRig|TestAQY_|NineGVNRig|TestSuspendFate|TestSuspendGuard'

  # ITEM 2 (ini-0lko): the CENSUS leg. Builds the real binary; no Claude needed.
  #
  # CI set INITECH_CENSUS exactly zero times before this bead, so the
  # zero-change census — the check that a single-window fleet renders
  # byte-identically to the shipped release — was a thing a human ran or did
  # not. Its own job rather than a line in composed-rigs because it proves a
  # different KIND of thing (the CLI surface and the rendered census) and would
  # otherwise be trimmed alongside rigs it has nothing to do with.
  #
  #   TestCensus_        a single-window fleet renders exactly as the release did
  #   TestRolesLessBoot_ a pure viewer boots with zero local agents
  #   TestWindowCLI_     the --window CLI surface: attach, detach, reattach, and
  #                      a viewer touching no project-root store
  census-leg:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Census and window-CLI integration
        env:
          INITECH_CENSUS: "1"
        run: go test ./internal/tui/ -count=1 -timeout 900s -run 'TestCensus_|TestRolesLessBoot_|TestWindowCLI_'

  # ITEM 5 (ini-0lko): the SAME composed rigs, on macOS.
  #
  # Before this, NO rig ran on macOS anywhere: the macos matrix leg is -short,
  # which skips every gated rig by construction. That is not a theoretical gap —
  # ini-hbj4 passed darwin and failed linux all four rounds, so a fleet whose
  # rigs only ever run on one OS is measuring one OS and reporting on two.
  #
  # It duplicates the ubuntu leg's selector deliberately: the invariants are the
  # same, the PLATFORM is the variable, and that is exactly the case where
  # duplication is the point rather than a merge candidate under the ini-uv2c
  # dedup rule.
  composed-rigs-macos:
    if: github.event_name == 'push'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Composed multi-window rigs (macOS)
        env:
          INITECH_9ISX: "1"
          INITECH_X5OB: "1"
          INITECH_AQY: "1"
          INITECH_35AK: "1"
          INITECH_9IMX: "1"
          INITECH_9GVN: "1"
        run: go test ./internal/tui/ -count=1 -timeout 900s -run 'NineISXRig|X5obRig|AttentionRig|TestAQY_|NineGVNRig|TestSuspendFate|TestSuspendGuard'
