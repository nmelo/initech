name: CI

on:
  push:
    # release/** (ini-cctz, the first release cut from a branch): for a push
    # GitHub reads this file FROM THE PUSHED COMMIT, so a release branch runs
    # CI only if the branch itself carries this line — a fix on main alone runs
    # nothing for it. And it must be a PUSH trigger: build-and-test's census steps
    # run only when github.event_name != 'pull_request', so a pull_request run is lighter,
    # and a PR into main runs on the merge ref rather than the branch sha.
    branches: [main, 'release/**']
  pull_request:
    branches: [main]
  # For MEASURING a branch on the operator's Mac (ini-bus5): a review branch
  # gets no push run and its pull_request run is on macos-latest, so this is
  # how a change to this file is timed on the runner pool main uses. NOT A
  # GATE: write-access only, and shipper's gate counts push runs only.
  workflow_dispatch:

permissions:
  contents: read

# The workbench runners run in a sandbox that denies every private address
# range; the one test that binds the host's own LAN address reads this and
# stops with a skip that names where it runs instead (rigs.yml's darwin job).
env:
  INITECH_CI_SANDBOX: "1"

# RUNNER SELECTION (ini-8k1o). Push, schedule and dispatch jobs run on the
# operator's Mac -- self-hosted runners labelled nmbp14, arm64 macOS, the same
# arch as GitHub's macos-latest -- when the repo variable MAC_RUNNER holds that
# label. pull_request runs ALWAYS stay on GitHub-hosted macos-latest: the repo is
# public, and a fork's PR must never execute on the operator's machine. With
# MAC_RUNNER unset, every job falls back to macos-latest.
#
# REVERT when the Mac is away: `gh variable delete MAC_RUNNER --repo nmelo/initech`
# -- no commit, takes effect on the next run. (Code revert, one line per job:
# replace the runs-on expression with macos-latest.) Delete the variable BEFORE
# the Mac goes away: timeout-minutes counts only once a job STARTS, so a job
# queued for an offline self-hosted runner waits (up to 24h) instead of failing.
#
# CONCURRENCY (ini-c5a.7, the operator via theguy): main pushes share one
# group with cancel-in-progress off, so a run that has started always finishes,
# and GitHub keeps at most one more, the newest, pending: a burst of pushes
# collapses to the newest sha instead of queueing one run per push, and an
# intermediate sha may get no run of its own (a cut there re-runs it). With
# cancel-in-progress on, a run waiting at the load gate was cancelled by the
# next push; with no group, every push queued a full run and the waiting runs
# held every runner. Every other run -- release/** pushes, pull requests,
# schedule, dispatch -- gets its own group (its run id) and is never cancelled
# or replaced.
concurrency:
  group: ${{ github.workflow }}-${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && 'main-push' || github.run_id }}
  cancel-in-progress: false

# SPEED (ini-bus5, ini-p2ve): every release cut gates on this workflow, so its
# wall time is release latency. Three levers, each measured on its own:
#
#   1. CACHE. actions/setup-go's cache is on only for pull_request. On the
#      self-hosted Mac GOCACHE and the module cache persist on disk between
#      runs, so restoring and saving them cost about a minute per job for
#      nothing. macos-latest keeps nothing, so pull requests keep the cache.
#      (With MAC_RUNNER unset, push runs also fall back to macos-latest without
#      a cache: slower, never wrong.)
#   2. SHARDS. The non-short suite, the long pole at about seven minutes, runs
#      as full-suite-1..4. scripts/shardtests lists every test, example and
#      fuzz target, gives each one shard by a stable hash of its package and
#      name, and runs it with make test-full's semantics: -count=1, no -short.
#   3. ONE RUN OF THE SUITE. build-and-test runs no tests: the build, vets,
#      lints, censuses and the witness, in seconds. It used to run the suite a
#      second time with -short, which only repeated work the shards do, since
#      -short only skips tests. The short census keeps that true: every
#      testing.Short() use must be a skip guard, so no test has a lighter
#      variant, or a short-only life, that no job here would run. make check
#      still runs the -short suite locally.
#
# ON THE WORKBENCH (ini-c5a.7, the operator via theguy): every job runs on
# the Linux runners registered as initech-ci on 192.168.1.100 (label
# initech-wb, in a sandbox: no sudo, no Docker, no LAN); a pull request falls
# back to GitHub-hosted ubuntu-latest, so a fork's code never reaches that
# machine. Tests that need macOS run in rigs.yml's darwin job, off this path. Nothing here
# runs on the shared Mac (192.168.1.207), so no job waits at its load gate.
# Seven jobs start together (build-and-test, full-suite-1..6) on seven
# runners, so none waits for a second wave, and the census follows. The wall
# is the longest of build-and-test and the shards, plus full-suite-census.
# Six shards keep a push under two minutes with every test on it, with a
# rigs run going: rigs jobs run at the lowest CPU priority (rigs.yml). Rigs run on GitHub-hosted macOS
# (rigs.yml), so they hold no Mac runner and add no load at the gate.
#
# THE CENSUS is what keeps the faster gate from running less. full-suite-census
# needs all six shards, runs even when one failed, and is red unless every
# shard passed AND the shards' own records show that their selections are
# disjoint, together equal the full test list, and every selected test
# reported a result exactly once. A test outside every shard, a test in two
# shards, a test that never ran and a shard that selected nothing each fail it.
# Since no other job runs the suite, this census is what proves every test ran
# on this push.
# The release gate's expected job set is these job names, read from this file
# at the cut (fleet/reference.md); keep job names equal to their keys (no
# matrix), or that set-equality breaks.

jobs:
  build-and-test:
    runs-on: ${{ github.event_name != 'pull_request' && 'initech-wb' || 'ubuntu-latest' }}
    # 25, not 15: this job also runs the census steps, bounded at 900 s.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: ${{ github.event_name == 'pull_request' }}

      - name: Build
        run: go build -ldflags "-s -w" -o initech .

      - name: Vet
        run: go vet ./...

      # ini-ybe.1: reject test names admitting "we just call it and see if
      # it crashes" intent. A content check — one leg answers for all.
      # No user input interpolated; the script path is static.
      - name: Lint test names
        run: bash scripts/lint-test-names.sh

      # THE SLOW STEPS, SIDE BY SIDE (ini-c5a.7): the release install suite (fake
      # brew, temp prefix, no network, no real Cellar; its two tests that re-sign
      # a binary with macOS codesign skip here), the publish suite (fake gh and
      # codesign, a local repository as the tap), and the
      # census leg (was its own job, census-leg): the env-gated census and
      # window-CLI integration tests, which no shard runs (their gate is off
      # there), so the suite still runs once; on push, schedule and dispatch
      # only, as the job was. Each is about a minute and they share nothing (each
      # Python suite makes its own temp folder and fakes); one after another they
      # made build-and-test the push run's long pole. Each exit code is read on
      # its own, unpiped: a red in any fails the step, and every log prints.
      # ini-0lko: the census line first names what it selected (-list).
      - name: Release suites and the census, side by side
        env:
          INITECH_CENSUS: "1"
        run: |
          set +e
          make release-install-test > release-install-test.log 2>&1 &
          install_pid=$!
          make release-publish-test > release-publish-test.log 2>&1 &
          publish_pid=$!
          census_pid=""
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            {
              go test ./internal/tui/ -list 'TestCensus_|TestRolesLessBoot_|TestWindowCLI_' &&
              go test ./internal/tui/ -count=1 -timeout 900s -run 'TestCensus_|TestRolesLessBoot_|TestWindowCLI_'
            } > census.log 2>&1 &
            census_pid=$!
          fi
          failed=0
          report() { # report <name> <pid> <log>
            wait "$2"; rc=$?
            echo "::group::$1 (exit $rc)"; cat "$3"; echo "::endgroup::"
            if [ "$rc" -ne 0 ]; then echo "::error::$1 failed (exit $rc)"; failed=1; fi
          }
          report "Install step tests" "$install_pid" release-install-test.log
          report "Publish step tests" "$publish_pid" release-publish-test.log
          if [ -n "$census_pid" ]; then
            report "Census and window-CLI integration" "$census_pid" census.log
          else
            echo "Census and window-CLI integration: skipped on a pull request, as census-leg was"
          fi
          exit "$failed"

      # ini-2x8.8: fail when a test file compiles on one platform and not
      # another without a declared exemption. Static (`go list` applies build
      # constraints without running anything), so one leg answers for all three
      # -- one leg answers for all. Also runs in `make check`
      # at commit time; this is the backstop for a push that skipped it.
      - name: Test census (cross-platform suite parity)
        run: go run ./scripts/testcensus

      # ini-0lko: fail when an env-gated rig exists that no CI job runs. The
      # composed-rigs job names every rig TWICE -- an `env:` block and a `-run`
      # selector -- and a rig runs only when both mention it. Both lists are
      # hand-maintained, which is how INITECH_9IMX went un-run for its entire
      # life while the job reported green, and how INITECH_35AK was wired into
      # `env:` but left out of the selector (caught by a human reading a diff).
      # This step reads THIS file and the test inventory and derives the answer,
      # so the next unwired rig fails the build instead of going quiet.
      # ini-nvpg: this same run now checks a SECOND inventory -- Makefile
      # targets. A target nothing invokes is the Makefile's version of a gated
      # rig nobody runs, and `make test-race` was exactly that: written
      # deliberately, in no gate, with 7 data races behind it (ini-4cfl).
      #
      # Static (parse-only), so one leg answers for all. (Was "all three" until
      # ini-ibsm left macOS the only tested platform.)
      - name: Census (every gated rig and every make target is invoked or exempted)
        run: go run ./scripts/rigcensus -v

      # ini-47w: witness WHICH tests this platform actually compiled, by name.
      # Build constraints silently remove whole suites from a leg -- a portable
      # helper parked in a '//go:build !windows' file drags every consumer out
      # with it, and CI still reports that leg green because a green run does
      # not witness suites that never ran. This lists the names so absence is
      # visible in the log rather than inferred from a passing total.
      #
      # Runs BEFORE Test on purpose: when restoring a suite to a platform
      # unmasks real failures, the names are already in the log above them.
      # -list compiles and enumerates without running, so it costs seconds.
      - name: Witness tests present on this platform
        run: go test ./internal/tui/ -list '.*' -count=1

      # ini-p2ve.2: this job runs no tests. The suite runs once, without
      # -short, in the full-suite shards, which covers every test -short would
      # run only while every testing.Short() use is a skip guard. This census
      # is red the day one is not (a lighter variant, a short-only test).
      - name: Short census (every testing.Short() use is a skip guard)
        run: go run ./scripts/shortcensus -v

  # THE NON-SHORT SUITE, on one platform (ini-4bf2), in six shards (ini-bus5,
  # ini-p2ve, ini-c5a.3, ini-c5a.7). The only run of the test suite in this workflow.
  #
  # `make test` runs -short. That is not an oversight -- -short skips slow PTY
  # integration tests, which is worth having locally. What was missing once is
  # that NOTHING ran the other half. A belt regression (ini-4bf2) reddened
  # TestInjectText_StashSkipsRetry the moment it shipped, the test did its job,
  # and no gate could see it: main carried a red full suite through v2.7.9 AND
  # v2.8.0 because every gate wore the same blindfold.
  #
  # One platform, not the matrix: the tests this adds are unix-PTY integration
  # tests that do not run on windows anyway, and the point is coverage of the
  # skipped HALF, not of every OS. Gated rigs stay opt-in behind their env vars,
  # so these legs do not spawn Claude sessions. The six shards together run
  # what `make test-full` runs (see SPEED above); full-suite-census proves it.
  full-suite-1:
    runs-on: ${{ github.event_name != 'pull_request' && 'initech-wb' || 'ubuntu-latest' }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: ${{ github.event_name == 'pull_request' }}

      - name: Test shard 1 of 6 (full, no -short)
        run: go run ./scripts/shardtests run -shards 6 -shard 1 -out shard-record

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-suite-shard-1
          path: shard-record
          if-no-files-found: error

  full-suite-2:
    runs-on: ${{ github.event_name != 'pull_request' && 'initech-wb' || 'ubuntu-latest' }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: ${{ github.event_name == 'pull_request' }}

      - name: Test shard 2 of 6 (full, no -short)
        run: go run ./scripts/shardtests run -shards 6 -shard 2 -out shard-record

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-suite-shard-2
          path: shard-record
          if-no-files-found: error

  full-suite-3:
    runs-on: ${{ github.event_name != 'pull_request' && 'initech-wb' || 'ubuntu-latest' }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: ${{ github.event_name == 'pull_request' }}

      - name: Test shard 3 of 6 (full, no -short)
        run: go run ./scripts/shardtests run -shards 6 -shard 3 -out shard-record

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-suite-shard-3
          path: shard-record
          if-no-files-found: error

  full-suite-4:
    runs-on: ${{ github.event_name != 'pull_request' && 'initech-wb' || 'ubuntu-latest' }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: ${{ github.event_name == 'pull_request' }}

      - name: Test shard 4 of 6 (full, no -short)
        run: go run ./scripts/shardtests run -shards 6 -shard 4 -out shard-record

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-suite-shard-4
          path: shard-record
          if-no-files-found: error

  full-suite-5:
    runs-on: ${{ github.event_name != 'pull_request' && 'initech-wb' || 'ubuntu-latest' }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: ${{ github.event_name == 'pull_request' }}

      - name: Test shard 5 of 6 (full, no -short)
        run: go run ./scripts/shardtests run -shards 6 -shard 5 -out shard-record

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-suite-shard-5
          path: shard-record
          if-no-files-found: error

  full-suite-6:
    runs-on: ${{ github.event_name != 'pull_request' && 'initech-wb' || 'ubuntu-latest' }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: ${{ github.event_name == 'pull_request' }}

      - name: Test shard 6 of 6 (full, no -short)
        run: go run ./scripts/shardtests run -shards 6 -shard 6 -out shard-record

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-suite-shard-6
          path: shard-record
          if-no-files-found: error

  full-suite-census:
    needs: [full-suite-1, full-suite-2, full-suite-3, full-suite-4, full-suite-5, full-suite-6]
    if: always()
    runs-on: ${{ github.event_name != 'pull_request' && 'initech-wb' || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: ${{ github.event_name == 'pull_request' }}

      # Reads the six shard command lines themselves (the "run: go run" form
      # only they use, never this step's own text) and requires all six, so
      # it cannot pass by matching nothing.
      - name: No shard step runs -short
        run: |
          lines=$(grep -E '^ +run: go run \./scripts/shardtests run ' .github/workflows/ci.yml)
          echo "$lines"
          test "$(printf '%s\n' "$lines" | grep -c .)" -eq 6 || { echo "expected the 6 shard command lines"; exit 1; }
          if printf '%s\n' "$lines" | grep -q short; then
            echo "a shard step runs -short: the full suite never does"; exit 1
          fi

      - uses: actions/download-artifact@v4
        if: always()
        with:
          pattern: full-suite-shard-*
          path: shard-records

      - name: Census (every test selected by exactly one shard and run exactly once)
        if: always()
        run: go run ./scripts/shardtests census -shards 6 shard-records/full-suite-shard-1 shard-records/full-suite-shard-2 shard-records/full-suite-shard-3 shard-records/full-suite-shard-4 shard-records/full-suite-shard-5 shard-records/full-suite-shard-6

      - name: Every shard passed
        if: always()
        env:
          S1: ${{ needs.full-suite-1.result }}
          S2: ${{ needs.full-suite-2.result }}
          S3: ${{ needs.full-suite-3.result }}
          S4: ${{ needs.full-suite-4.result }}
          S5: ${{ needs.full-suite-5.result }}
          S6: ${{ needs.full-suite-6.result }}
        run: |
          echo "full-suite-1: $S1  full-suite-2: $S2  full-suite-3: $S3  full-suite-4: $S4  full-suite-5: $S5  full-suite-6: $S6"
          test "$S1" = success && test "$S2" = success && test "$S3" = success && test "$S4" = success && test "$S5" = success && test "$S6" = success

  # ITEM 2 (ini-0lko): the CENSUS leg. Builds the real binary; no Claude needed.
  #
  # CI set INITECH_CENSUS exactly zero times before this bead, so the
  # zero-change census — the check that a single-window fleet renders
  # byte-identically to the shipped release — was a thing a human ran or did
  # not. Its own job rather than a line in composed-rigs because it proves a
  # different KIND of thing (the CLI surface and the rendered census) and would
  # otherwise be trimmed alongside rigs it has nothing to do with.
  #
  #   TestCensus_        a single-window fleet renders exactly as the release did
  #   TestRolesLessBoot_ a pure viewer boots with zero local agents
  #   TestWindowCLI_     the --window CLI surface: attach, detach, reattach, and
  #                      a viewer touching no project-root store
