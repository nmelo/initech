# app-tests runs the iPhone and iPad app's tests (app/) on the Mac runner,
# one simulator at a time, for one device per run.
#
# Start a run with app/scripts/app-tests-run.sh <ref> <iphone|ipad>, which
# checks the runners are online first; cite the run id on the bead.
#
# Guards:
# - Never for pull requests: the repo is public, and a fork's code must never
#   run on the operator's machine (the same rule as ci.yml).
# - Off until the repo variable APP_TESTS is "on": the runners' machine is
#   shared with other projects' iOS jobs, and the switch is flipped only once
#   a load sample shows it can take one simulator. With it unset the job is
#   skipped, so no runner is used at all.
# - One simulator at a time on the host: sim-test.sh's lock is the rule. A job
#   that finds the simulator busy waits at the lock, for at most 20 minutes,
#   and says once a minute which run holds it; past that it fails naming the
#   holder. The concurrency group below is per ref and does not limit the host.
# - The job waits at the shared load gate first (.github/actions/load-gate,
#   with simulators): while the host's 5-minute load is over 24, during the
#   other project's nightly window, and while any simulator is booted there by
#   anyone; after 20 minutes it fails the job, naming the load. The job's timeout allows
#   that wait and the lock's; the run itself stays bounded by sim-test.sh
#   (7 minutes for the first boot, 18 for the tests).
# - app/scripts/sim-test.sh makes a simulator for the run, waits for its first
#   boot to finish, and deletes it however the run ends. With CRASH_FATAL=ui a
#   new crash report from the app, its test runners, SpringBoard or PosterBoard
#   fails the job by name; any other report from that device is named as a
#   warning (nobody sits at this host, so no dialog reaches anyone).
# - sim-test.sh holds its lock for its whole run, whichever job started it, and
#   fails with exit 8 if any process of its simulator outlives the delete; it
#   looks at its own device only.
name: app-tests

on:
  workflow_dispatch:
    inputs:
      device:
        description: "iphone or ipad"
        required: true
        default: iphone
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/app-tests.yml"]

# ONE GROUP PER REF: GitHub keeps one running and one pending run per group, so
# one group for every ref let a push to main replace a run pending on a branch,
# with no notice. A newer run on the same ref still replaces an older pending
# one. Runs on different refs can overlap; the host lock in sim-test.sh is what
# keeps them to one simulator. A started run always finishes.
concurrency:
  group: app-sim-${{ github.ref }}
  cancel-in-progress: false

jobs:
  app-tests:
    if: github.event_name != 'pull_request' && vars.APP_TESTS == 'on'
    runs-on: ${{ vars.MAC_RUNNER || 'macos-latest' }}
    # The load gate (20), the lock (20), the first boot (7), the tests (18) and
    # setup, so each bound can speak for itself before the job's timeout does.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5

      - name: Xcode and the simulator runtime are here
        run: |
          xcodebuild -version || { echo "app-tests: no xcodebuild on $RUNNER_NAME" >&2; exit 5; }
          xcrun simctl list runtimes | grep -q 'iOS 27.0' \
            || { echo "app-tests: the iOS 27.0 simulator runtime is not installed on $RUNNER_NAME" >&2; exit 5; }

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Wait for the shared Mac host (load gate)
        uses: ./.github/actions/load-gate
        with:
          simulators: "true"

      - name: Test on a fresh simulator
        env:
          INITECH_AGENT: ci-${{ github.run_id }}
          CRASH_FATAL: ui
          DEVICE: ${{ github.event.inputs.device || 'iphone' }}
        run: |
          case "$DEVICE" in iphone|ipad) ;; *) echo "app-tests: device must be iphone or ipad" >&2; exit 2 ;; esac
          echo "app-tests: $DEVICE on $RUNNER_NAME, run $GITHUB_RUN_ID"
          # BuildInfoTests checks the build stamped this checkout's commit.
          export TEST_RUNNER_INITECH_EXPECT_COMMIT=$(git rev-parse --short HEAD)
          # The step runs under bash -e: keep sim-test's exit code so the summary
          # below prints however the run ended.
          rc=0
          app/scripts/sim-test.sh "$DEVICE" "$RUNNER_TEMP/xcodebuild.log" \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 300 || rc=$?
          grep -E 'Test Case .*(failed|skipped|exceeded)|TEST (SUCCEEDED|FAILED)' "$RUNNER_TEMP/xcodebuild.log" | sort -u
          echo "passed: $(grep -cE 'Test Case .*passed' "$RUNNER_TEMP/xcodebuild.log")"
          exit $rc

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-tests-${{ github.run_id }}
          # The hang probe's files exist only when xcodebuild went quiet after
          # its last suite (hang-probe.sh).
          path: |
            ${{ runner.temp }}/xcodebuild.log
            ${{ runner.temp }}/xcodebuild.log.hang
            ${{ runner.temp }}/xcodebuild.log.hang.sample
          if-no-files-found: ignore
