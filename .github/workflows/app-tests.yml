# app-tests runs the iPhone and iPad app's tests (app/) on the Mac runner,
# one simulator at a time, for one device per run.
#
# Start a run with app/scripts/app-tests-run.sh <branch|commit> <iphone|ipad>
# [screens] [tests], which checks the runners are online first; cite the run
# id on the bead.
#
# Pictures: a run that names screens (home,pane) uploads one PNG of each as the
# artifact app-screens-<run id>, and lists them in its summary. A named screen
# with no picture fails the job, by name. The repo is public and so are its
# artifacts: pictures come from the test fixtures only (app/scripts/shots.sh
# refuses a live screen or a live pairing) and are kept one day, the shortest
# GitHub allows. A run that names none takes none.
#
# A commit: a run by commit id is started on a branch and tests that commit
# only when the branch contains it; any other id is refused before checkout.
#
# Inputs are text a person typed: every one reaches a script through env,
# never pasted into the script's text.
#
# Guards:
# - Never for pull requests: the repo is public, and a fork's code must never
#   run on the operator's machine (the same rule as ci.yml).
# - Off until the repo variable APP_TESTS is "on": the runners' machine is
#   shared with other projects' iOS jobs, and the switch is flipped only once
#   a load sample shows it can take one simulator. With it unset the job is
#   skipped, so no runner is used at all.
# - One simulator at a time on the host: sim-test.sh's lock is the rule. A job
#   that finds the simulator busy waits at the lock, for at most 20 minutes,
#   and says once a minute which run holds it; past that it fails naming the
#   holder. The concurrency group below is per ref and does not limit the host.
# - The job waits at the shared load gate first (.github/actions/load-gate,
#   with simulators): while the host's 5-minute load is over 24, during the
#   other project's nightly window, and while any simulator is booted there by
#   anyone; after 20 minutes it fails the job, naming the load. The job's timeout allows
#   that wait and the lock's; the run itself stays bounded by sim-test.sh
#   (7 minutes for the first boot, 18 for the tests).
# - app/scripts/sim-test.sh makes a simulator for the run, waits for its first
#   boot to finish, and deletes it however the run ends. With CRASH_FATAL=ui a
#   new crash report from the app, its test runners, SpringBoard or PosterBoard
#   fails the job by name; any other report from that device is named as a
#   warning (nobody sits at this host, so no dialog reaches anyone).
# - sim-test.sh holds its lock for its whole run, whichever job started it, and
#   fails with exit 8 if any process of its simulator outlives the delete; it
#   looks at its own device only.
name: app-tests

on:
  workflow_dispatch:
    inputs:
      device:
        description: "iphone or ipad"
        required: true
        default: iphone
      screens:
        description: "screens to picture, comma separated (home, pane, panes, blockers, progress); empty for none"
        required: false
        default: ""
      sha:
        description: "a full commit id on this branch to test; empty for the branch's newest"
        required: false
        default: ""
      only:
        description: "tests to run, comma separated (InitechAppUITests/ScreenshotTests); empty for all"
        required: false
        default: ""
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/app-tests.yml"]

# ONE GROUP PER REF: GitHub keeps one running and one pending run per group, so
# one group for every ref let a push to main replace a run pending on a branch,
# with no notice. A newer run on the same ref still replaces an older pending
# one. Runs on different refs can overlap; the host lock in sim-test.sh is what
# keeps them to one simulator. A started run always finishes.
concurrency:
  group: app-sim-${{ github.ref }}
  cancel-in-progress: false

jobs:
  app-tests:
    if: github.event_name != 'pull_request' && vars.APP_TESTS == 'on'
    runs-on: ${{ vars.MAC_RUNNER || 'macos-latest' }}
    # The load gate (20), the lock (20), the first boot (7), the tests (18) and
    # setup, so each bound can speak for itself before the job's timeout does.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5
        with:
          # A run by commit id needs the branch's history, to see the commit on it.
          fetch-depth: ${{ github.event.inputs.sha && '0' || '1' }}

      - name: Check out the named commit
        if: github.event.inputs.sha != ''
        env:
          SHA: ${{ github.event.inputs.sha }}
        run: |
          case "$SHA" in *[!0-9a-f]*) echo "app-tests: refused: a commit is named by its full 40-digit id" >&2; exit 2 ;; esac
          [ "${#SHA}" -eq 40 ] || { echo "app-tests: refused: a commit is named by its full 40-digit id" >&2; exit 2; }
          git cat-file -e "$SHA^{commit}" 2>/dev/null || { echo "app-tests: refused: $GITHUB_REF_NAME has no commit $SHA" >&2; exit 2; }
          # Only a commit of the branch this run was started on: an id from a
          # fork is reachable on GitHub and must never run on this machine.
          git merge-base --is-ancestor "$SHA" HEAD || { echo "app-tests: refused: $SHA is not on $GITHUB_REF_NAME" >&2; exit 2; }
          git checkout --quiet --detach "$SHA"
          echo "app-tests: testing $(git rev-parse --short HEAD), a commit of $GITHUB_REF_NAME"

      - name: Xcode and the simulator runtime are here
        run: |
          xcodebuild -version || { echo "app-tests: no xcodebuild on $RUNNER_NAME" >&2; exit 5; }
          xcrun simctl list runtimes | grep -q 'iOS 27.0' \
            || { echo "app-tests: the iOS 27.0 simulator runtime is not installed on $RUNNER_NAME" >&2; exit 5; }

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Wait for the shared Mac host (load gate)
        uses: ./.github/actions/load-gate
        with:
          simulators: "true"

      # The debug launch options (a debug build opened unlocked on a named screen)
      # must never ship: every run builds the Release app and fails if any option's
      # name is in it, and checks the Debug app holds them all, so the search is
      # known to see them. No simulator: two unsigned device builds.
      - name: The Release app holds no debug launch option
        timeout-minutes: 25
        run: app/scripts/release-check.sh build "$RUNNER_TEMP/release-check"

      - name: Test on a fresh simulator
        env:
          INITECH_AGENT: ci-${{ github.run_id }}
          CRASH_FATAL: ui
          DEVICE: ${{ github.event.inputs.device || 'iphone' }}
          SHOTS: ${{ github.event.inputs.screens }}
          SHOT_OUT: ${{ runner.temp }}/app-screens
          ONLY: ${{ github.event.inputs.only }}
        run: |
          case "$DEVICE" in iphone|ipad) ;; *) echo "app-tests: device must be iphone or ipad" >&2; exit 2 ;; esac
          echo "app-tests: $DEVICE on $RUNNER_NAME, run $GITHUB_RUN_ID"
          set -f # test names are words, never patterns
          only=()
          for t in $(printf '%s\n' "$ONLY" | tr ',' ' '); do
            [[ "$t" =~ ^[A-Za-z0-9_]+(/[A-Za-z0-9_]+){0,2}$ ]] || { echo "app-tests: \"$t\" is not a test name" >&2; exit 2; }
            only+=("-only-testing:$t")
          done
          rm -rf "${SHOT_OUT:?}"
          # BuildInfoTests checks the build stamped this checkout's commit.
          export TEST_RUNNER_INITECH_EXPECT_COMMIT=$(git rev-parse --short HEAD)
          # The step runs under bash -e: keep sim-test's exit code so the summary
          # below prints however the run ended.
          rc=0
          app/scripts/sim-test.sh "$DEVICE" "$RUNNER_TEMP/xcodebuild.log" \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 300 ${only[@]+"${only[@]}"} || rc=$?
          grep -E 'Test Case .*(failed|skipped|exceeded)|TEST (SUCCEEDED|FAILED)' "$RUNNER_TEMP/xcodebuild.log" | sort -u
          echo "passed: $(grep -cE 'Test Case .*passed' "$RUNNER_TEMP/xcodebuild.log")"
          exit $rc

      # The job counts the pictures itself, whatever the checked-out sim-test.sh
      # did: a run at a commit from before pictures must fail too, never pass
      # with none.
      - name: Every named screen has its picture
        if: always() && github.event.inputs.screens != ''
        env:
          SHOTS: ${{ github.event.inputs.screens }}
          SHOT_OUT: ${{ runner.temp }}/app-screens
        run: |
          set -f
          missing=0
          {
            echo "### Screens of run $GITHUB_RUN_ID"
            echo
            echo "Artifact app-screens-$GITHUB_RUN_ID, kept one day: gh run download $GITHUB_RUN_ID -n app-screens-$GITHUB_RUN_ID"
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          for n in $(printf '%s\n' "$SHOTS" | tr ',' ' '); do
            [[ "$n" =~ ^[a-z0-9][a-z0-9-]*$ ]] || { echo "app-tests: \"$n\" is not a screen name" >&2; exit 2; }
            if [ -s "$SHOT_OUT/$n.png" ]; then
              echo "- $n: $n.png" >> "$GITHUB_STEP_SUMMARY"
              echo "app-tests: screen $n: $n.png"
            else
              echo "- $n: no picture" >> "$GITHUB_STEP_SUMMARY"
              echo "app-tests: no picture of $n" >&2
              missing=1
            fi
          done
          exit $missing

      - name: Upload the pictures
        if: always() && github.event.inputs.screens != ''
        uses: actions/upload-artifact@v4
        with:
          name: app-screens-${{ github.run_id }}
          path: ${{ runner.temp }}/app-screens/*.png
          retention-days: 1
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-tests-${{ github.run_id }}
          # The hang probe's files exist only when xcodebuild went quiet after
          # its last suite (hang-probe.sh).
          path: |
            ${{ runner.temp }}/xcodebuild.log
            ${{ runner.temp }}/xcodebuild.log.hang
            ${{ runner.temp }}/xcodebuild.log.hang.sample
          if-no-files-found: ignore
