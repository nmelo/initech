name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  actions: read

# Runner selection and the MAC_RUNNER revert: see the header of ci.yml (ini-8k1o).
jobs:
  # THE RELEASE BUILD RUNS NO TESTS. The tests run once, in CI, on the platform
  # we test (macOS, ini-ibsm), and shipper's gate tags only a commit whose push
  # CI run is green with ci.yml's full job set. The release job proves the same
  # for every v* tag before it builds: scripts/releaseguard reads the job list
  # from ci.yml at the tagged commit, the list the gate reads, and refuses a
  # tag without a green push run carrying all of it. A second test run here only
  # re-ran a suite already green at that commit and cost two thirds of the
  # build (ini-c5a.5). The job stays on ubuntu-latest deliberately: it
  # cross-compiles every goos/goarch and tests nothing, and stop-testing is not
  # stop-shipping.
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Refuse a tag without green CI at its commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: go run ./scripts/releaseguard -sha "$GITHUB_SHA"

      - name: Run goreleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
