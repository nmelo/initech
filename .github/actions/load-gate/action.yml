name: Load gate
description: >-
  Holds a job on the shared Mac runner host until it can take it (ini-c5a.7,
  the operator's conditions): while the host's 5-minute load is over 24, while
  it is 11:45 to 12:15 in New York (another project's nightly build), and, with
  simulators set, while any iOS simulator is booted there, by any user. After
  20 minutes it fails the job with one error line naming the load and the line
  (or the window, or the simulators) and the wait, so the runner frees and the
  rerun is a choice; a host it cannot read runs the job. Use it right after setup-go, once per run:
  in ci.yml it is the last step of the gate job, which every job that starts
  the work needs, so a waiting run holds one runner; a one-job workflow
  (app-tests) uses it in that job. Jobs that follow other jobs never use it, so
  a run is never held by the load it made itself. GitHub-hosted runners skip it.
inputs:
  simulators:
    description: also wait while any iOS simulator is booted on the host
    default: 'false'
runs:
  using: composite
  steps:
    - name: Load gate (the shared Mac host)
      if: runner.environment == 'self-hosted'
      shell: bash
      run: go run ./scripts/loadgate ${{ inputs.simulators == 'true' && '-simulators' || '' }}
