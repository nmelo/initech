# The source of InitechApp.xcodeproj. After editing, regenerate with
# `xcodegen generate --spec app/project.yml` and commit both files: the
# committed project is what xcodebuild reads, so a build needs only Xcode.
name: InitechApp
options:
  bundleIdPrefix: co.nmelo
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "3"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: K7Z8YKVA8G
# The model logic, a local package: no network to resolve it (app/README.md).
packages:
  InitechCore:
    path: InitechCore
targets:
  InitechApp:
    type: application
    platform: iOS
    sources: [InitechApp]
    dependencies:
      - package: InitechCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.nmelo.initech
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        # Merged into the generated Info.plist: the keys that cannot be
        # INFOPLIST_KEY_ settings (App Transport Security).
        INFOPLIST_FILE: InitechApp/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: initech
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_NSCameraUsageDescription: "initech scans the pairing code your Mac shows."
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "initech talks to the initech service on your Mac."
        INFOPLIST_KEY_NSFaceIDUsageDescription: "initech locks behind Face ID because it can type into your agents."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"
        # The stamp phase below reads git and writes the built Info.plist.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
      # Push: a Release build (TestFlight, the App Store) signs with a
      # distribution profile and its production push environment; a Debug
      # build signs with a development profile, so its environment is
      # development.
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: InitechApp/InitechApp.Debug.entitlements
        Release:
          CODE_SIGN_ENTITLEMENTS: InitechApp/InitechApp.entitlements
    # Stamp the build commit: the short sha of the checkout this build was made
    # from, into the built Info.plist as InitechCommit (About shows it). Runs
    # on every build, so an incremental build never keeps an old sha; no
    # readable commit writes "unknown". Before signing, as every build phase is.
    postBuildScripts:
      - name: Stamp the build commit
        basedOnDependencyAnalysis: false
        # The built Info.plist as an input orders this phase after the plist
        # is written; without it the phase can run first and be overwritten.
        inputFiles:
          - $(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)
        script: |
          sha=$(git -C "$SRCROOT" rev-parse --short HEAD 2>/dev/null) || sha=unknown
          case "$sha" in ""|*[!0-9a-f]*) sha=unknown ;; esac
          plist="$TARGET_BUILD_DIR/$INFOPLIST_PATH"
          /usr/libexec/PlistBuddy -c "Delete :InitechCommit" "$plist" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :InitechCommit string $sha" "$plist"
          echo "Stamp the build commit: InitechCommit=$sha"
  InitechAppTests:
    type: bundle.unit-test
    platform: iOS
    sources: [InitechAppTests]
    dependencies:
      - target: InitechApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.nmelo.initech.tests
        GENERATE_INFOPLIST_FILE: YES
  InitechAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - InitechAppUITests
      - InitechCore/Sources/InitechCore/Models.swift
      - InitechCore/Sources/InitechCore/Pairing.swift
      - InitechAppTests/FixtureServer.swift
    dependencies:
      - target: InitechApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.nmelo.initech.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: InitechApp
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) UITESTS"
schemes:
  InitechApp:
    build:
      targets:
        InitechApp: all
        InitechAppTests: [test]
        InitechAppUITests: [test]
    test:
      # The package's tests run here too, so app-tests covers the moved tests;
      # `swift test` is the fast local run of the same tests.
      targets:
        - InitechAppTests
        - package: InitechCore/InitechCoreTests
        - InitechAppUITests
